
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>bydomingo — CMS</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
</head>

<body>

  <!-- LIBRARIES -->

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <script src="https://unpkg.com/markdown-it@14/dist/markdown-it.min.js"></script>

  <script src="https://unpkg.com/decap-cms-app@3.15.1/dist/decap-cms-app.js"></script>

  <script>
    const h = React.createElement;

    const markdown = window.markdownit({
      html: false,
      breaks: true,
      linkify: true
    });

    /* DATE: 12 nov 2026 */

    function formatDate(value) {
      if (!value) return '';

      const text = String(value);
      const match = text.match(
        /^(\d{4})-(\d{2})-(\d{2})/
      );

      let date;

      if (match) {
        date = new Date(
          Date.UTC(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
          )
        );
      } else {
        date = new Date(value);
      }

      if (Number.isNaN(date.getTime())) {
        return '';
      }

      return new Intl.DateTimeFormat('en-GB', {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
        timeZone: 'UTC'
      }).format(date).toLowerCase();
    }

    /* DECAPP ASSET RESOLUTION */

    function assetUrl(path, getAsset) {
      if (!path) return '';

      try {
        const asset = getAsset(path);

        if (asset) {
          return asset.toString();
        }
      } catch (error) {
        // Fall back to the original path.
      }

      return path;
    }

    /* CONTENT BLOCKS */

    function renderBlock(block, index, getAsset) {
      if (!block) return null;

      const type = block.type;
      const alignment =
        block.alignment ||
        (type === 'text' ? 'left' : 'center');

      const size =
        block.size ||
        (type === 'text' ? 'normal' : 'medium');

      if (type === 'text') {
        return h(
          'div',
          {
            key: index,
            className:
              'bd-block bd-text bd-align-' +
              alignment +
              ' bd-size-' +
              size
          },
          h('div', {
            className: 'bd-text-body',
            dangerouslySetInnerHTML: {
              __html: markdown.render(
                block.text || ''
              )
            }
          })
        );
      }

      const src = assetUrl(block.src, getAsset);

      let media = null;

      if (type === 'image') {
        media = h('img', {
          src: src,
          alt: block.alt || ''
        });
      }

      if (type === 'audio') {
        media = h('audio', {
          src: src,
          controls: true,
          preload: 'none'
        });
      }

      if (type === 'video') {
        media = h('video', {
          src: src,
          controls: true,
          preload: 'metadata'
        });
      }

      if (!media) return null;

      return h(
        'div',
        {
          key: index,
          className:
            'bd-block bd-media bd-align-' +
            alignment +
            ' bd-size-' +
            size
        },
        h(
          'div',
          { className: 'bd-media-inner' },
          media,
          block.caption
            ? h(
                'div',
                { className: 'bd-caption' },
                block.caption
              )
            : null
        )
      );
    }

    /* PREVIEW COMPONENT */

    function PostPreview(props) {
      const entry = props.entry;
      const getAsset = props.getAsset;

      const title =
        entry.getIn(['data', 'title']) || 'Untitled';

      const date =
        entry.getIn(['data', 'date']);

      const category =
        entry.getIn(['data', 'category']) || '';

      const backgroundImage =
        entry.getIn(['data', 'backgroundImage']);

      const blocksValue =
        entry.getIn(['data', 'blocks']);

      const blocks = blocksValue
        ? blocksValue.toJS()
        : [];

      const backgroundUrl = assetUrl(
        backgroundImage,
        getAsset
      );

      const backgroundStyle = backgroundUrl
        ? {
            '--bd-background':
              'url(' + JSON.stringify(backgroundUrl) + ')'
          }
        : {};

      return h(
        'main',
        { className: 'bd-preview' },

        h(
          'header',
          { className: 'bd-header' },
          h('h1', null, 'bydomingo')
        ),

        h(
          'details',
          {
            className:
              'bd-post' +
              (backgroundUrl ? ' bd-has-background' : ''),
            style: backgroundStyle,
            open: true
          },

          h(
            'summary',
            { className: 'bd-summary' },

            h(
              'span',
              { className: 'bd-heading' },

              h(
                'span',
                { className: 'bd-title' },
                title
              ),

              h(
                'time',
                { className: 'bd-date' },
                formatDate(date)
              )
            ),

            category
              ? h(
                  'span',
                  { className: 'bd-category' },
                  category
                )
              : null,

            h(
              'span',
              { className: 'bd-symbol' }
            )
          ),

          h(
            'div',
            { className: 'bd-content' },
            ...blocks.map((block, index) =>
              renderBlock(block, index, getAsset)
            )
          )
        )
      );
    }

    /* PREVIEW STYLES */

    const previewCSS = `
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #0d0d0d;
        color: #f5f3ee;
        font-family: "Crimson Pro", Georgia, serif;
        font-size: 19px;
        -webkit-font-smoothing: antialiased;
      }

      .bd-preview {
        width: 100%;
        min-height: 100vh;
        padding: 45px 5% 100px;
        background: #0d0d0d;
        color: #f5f3ee;
      }

      .bd-header {
        margin-bottom: 38px;
        text-align: center;
      }

      .bd-header h1 {
        margin: 0;
        font-size: clamp(44px, 6vw, 72px);
        font-weight: 400;
        line-height: 1.1;
      }

      .bd-post {
        position: relative;
        isolation: isolate;
        width: 100%;
        border-top: 1px solid #383838;
        border-bottom: 1px solid #383838;
        background: #0d0d0d;
      }

      /* SAME COVER BACKGROUND AS WEBSITE */

      .bd-post.bd-has-background::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;

        background-image:
          linear-gradient(
            rgba(0, 0, 0, 0.25),
            rgba(0, 0, 0, 0.25)
          ),
          var(--bd-background);

        background-size:
          100% 100%,
          cover;

        background-position:
          center center,
          center center;

        background-repeat: no-repeat;
        opacity: 0.6;
      }

      .bd-summary,
      .bd-content {
        position: relative;
        z-index: 1;
      }

      .bd-summary {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 15px 3px;
        cursor: pointer;
        list-style: none;
        user-select: none;
      }

      .bd-summary::-webkit-details-marker {
        display: none;
      }

      .bd-summary::marker {
        content: "";
      }

      .bd-heading {
        display: flex;
        flex: 1;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 4px 12px;
        min-width: 0;
      }

      .bd-title {
        font-size: 21px;
        font-weight: 400;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }

      .bd-date {
        flex-shrink: 0;
        color: #8d8d8d;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .bd-category {
        flex-shrink: 0;
        color: #aaa;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .bd-symbol {
        flex: 0 0 18px;
        width: 18px;
        text-align: center;
        font-size: 21px;
        opacity: 0.65;
      }

      .bd-symbol::after {
        content: "+";
      }

      .bd-post[open] .bd-symbol::after {
        content: "−";
      }

      .bd-content {
        padding: 8px 3px 28px;
        font-size: 19px;
        line-height: 1.4;
      }

      .bd-block {
        width: 100%;
        margin-bottom: 18px;
      }

      .bd-text-body {
        overflow-wrap: break-word;
      }

      .bd-text-body p {
        margin: 0 0 0.65em;
      }

      .bd-text-body p:last-child {
        margin-bottom: 0;
      }

      .bd-text-body strong {
        font-weight: 600;
      }

      .bd-text-body a {
        color: inherit;
        text-underline-offset: 3px;
      }

      .bd-text-body h2,
      .bd-text-body h3 {
        margin: 0.7em 0 0.35em;
        font-weight: 600;
      }

      .bd-text-body blockquote {
        border-left: 1px solid #777;
        margin: 0.8em 0;
        padding-left: 1em;
        opacity: 0.85;
      }

      .bd-text-body img {
        display: block;
        max-width: 100%;
        height: auto;
      }

      .bd-align-left {
        text-align: left;
      }

      .bd-align-center {
        text-align: center;
      }

      .bd-align-right {
        text-align: right;
      }

      .bd-text.bd-size-small {
        font-size: 16px;
      }

      .bd-text.bd-size-normal {
        font-size: 19px;
      }

      .bd-text.bd-size-large {
        font-size: 27px;
      }

      .bd-media {
        display: flex;
        flex-direction: column;
      }

      .bd-media.bd-align-left {
        align-items: flex-start;
      }

      .bd-media.bd-align-center {
        align-items: center;
      }

      .bd-media.bd-align-right {
        align-items: flex-end;
      }

      .bd-media-inner {
        max-width: 100%;
      }

      .bd-media.bd-size-small .bd-media-inner {
        width: 30%;
      }

      .bd-media.bd-size-medium .bd-media-inner {
        width: 50%;
      }

      .bd-media.bd-size-large .bd-media-inner {
        width: 75%;
      }

      .bd-media.bd-size-full .bd-media-inner {
        width: 100%;
      }

      .bd-media img,
      .bd-media video,
      .bd-media audio {
        display: block;
        width: 100%;
        height: auto;
      }

      .bd-caption {
        margin-top: 7px;
        font-size: 15px;
        opacity: 0.65;
      }

      @media (max-width: 650px) {
        .bd-preview {
          padding: 35px 5% 70px;
        }

        .bd-title {
          font-size: 19px;
        }

        .bd-date,
        .bd-category {
          font-size: 9px;
        }

        .bd-media.bd-size-small .bd-media-inner {
          width: 65%;
        }

        .bd-media.bd-size-medium .bd-media-inner,
        .bd-media.bd-size-large .bd-media-inner {
          width: 100%;
        }
      }
    `;

    /* REGISTER WITH DECAP */

    CMS.registerPreviewStyle(previewCSS, {
      raw: true
    });

    CMS.registerPreviewTemplate(
      'posts',
      PostPreview
    );
  </script>
</body>
</html>
