backend:
  name: github
  repo: Saravans123/bydomingo
  branch: main

local_backend: true

publish_mode: simple

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: "https://bydomingo.com"
display_url: "https://bydomingo.com"

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: poetry
    label: Poetry
    label_singular: Poem
    folder: "src/content/poetry"
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - label: Title
        name: title
        widget: string

      - label: Date
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: Short description
        name: summary
        widget: text
        required: false

      - label: Main image
        name: image
        widget: image
        required: false

      - label: Draft
        name: draft
        widget: boolean
        default: false

      - label: Poem
        name: body
        widget: markdown

  - name: robots
    label: Robots
    label_singular: Robot
    folder: "src/content/robots"
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - label: Title
        name: title
        widget: string

      - label: Date
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: Short description
        name: summary
        widget: text
        required: false

      - label: Main image
        name: image
        widget: image
        required: false

      - label: Materials
        name: materials
        widget: string
        required: false

      - label: Status
        name: status
        widget: string
        required: false

      - label: Video URL
        name: video
        widget: string
        required: false

      - label: Draft
        name: draft
        widget: boolean
        default: false

      - label: Full notes
        name: body
        widget: markdown

  - name: music
    label: Music
    label_singular: Music piece
    folder: "src/content/music"
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - label: Title
        name: title
        widget: string

      - label: Date
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: Short description
        name: summary
        widget: text
        required: false

      - label: Cover image
        name: image
        widget: image
        required: false

      - label: Audio file
        name: audio
        widget: file
        required: false

      - label: Duration
        name: duration
        widget: string
        required: false

      - label: Draft
        name: draft
        widget: boolean
        default: false

      - label: Notes
        name: body
        widget: markdown