
backend:
  name: github
  repo: Saravans123/bydomingo
  branch: main

local_backend: true
publish_mode: simple

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: "https://bydomingo.com"
display_url: "https://bydomingo.com"

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: "src/content/posts"
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - label: Title
        name: title
        widget: string

      - label: Date
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: Draft
        name: draft
        widget: boolean
        default: false

      - label: Background image
        name: backgroundImage
        widget: image
        required: false
        hint: "Optional image behind the post title and content."

      - label: Content
        name: blocks
        widget: list
        required: false
        typeKey: type
        summary: "{{type}}"

        types:
          - label: Text
            name: text
            widget: object
            fields:
              - label: Text
                name: text
                widget: richtext
                modes:
                  - rich_text
                  - raw
                buttons:
                  - bold
                  - italic
                  - strikethrough
                  - link
                  - heading-two
                  - heading-three
                  - quote
                  - bulleted-list
                  - numbered-list
                editor_components:
                  - image
                hint: "Write freely and insert images between paragraphs."

              - label: Size
                name: size
                widget: select
                options:
                  - { label: Small, value: small }
                  - { label: Normal, value: normal }
                  - { label: Large, value: large }
                default: normal

              - label: Alignment
                name: alignment
                widget: select
                options:
                  - { label: Left, value: left }
                  - { label: Centre, value: center }
                  - { label: Right, value: right }
                default: left

          - label: Image
            name: image
            widget: object
            fields:
              - label: Image
                name: src
                widget: image

              - label: Alternative text
                name: alt
                widget: string
                required: false

              - label: Size
                name: size
                widget: select
                options:
                  - { label: Small, value: small }
                  - { label: Medium, value: medium }
                  - { label: Large, value: large }
                  - { label: Full width, value: full }
                default: medium

              - label: Alignment
                name: alignment
                widget: select
                options:
                  - { label: Left, value: left }
                  - { label: Centre, value: center }
                  - { label: Right, value: right }
                default: center

              - label: Caption
                name: caption
                widget: string
                required: false

          - label: Audio
            name: audio
            widget: object
            fields:
              - label: Audio file
                name: src
                widget: file

              - label: Size
                name: size
                widget: select
                options:
                  - { label: Small, value: small }
                  - { label: Medium, value: medium }
                  - { label: Large, value: large }
                  - { label: Full width, value: full }
                default: large

              - label: Alignment
                name: alignment
                widget: select
                options:
                  - { label: Left, value: left }
                  - { label: Centre, value: center }
                  - { label: Right, value: right }
                default: center

              - label: Caption
                name: caption
                widget: string
                required: false

          - label: Video
            name: video
            widget: object
            fields:
              - label: Video file
                name: src
                widget: file

              - label: Size
                name: size
                widget: select
                options:
                  - { label: Small, value: small }
                  - { label: Medium, value: medium }
                  - { label: Large, value: large }
                  - { label: Full width, value: full }
                default: large

              - label: Alignment
                name: alignment
                widget: select
                options:
                  - { label: Left, value: left }
                  - { label: Centre, value: center }
                  - { label: Right, value: right }
                default: center

              - label: Caption
                name: caption
                widget: string
                required: false
